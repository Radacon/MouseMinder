name: Firmware release

on:
  push:
    tags:
      - "firmware-v*"

permissions:
  contents: write

concurrency:
  group: firmware-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Validate release tag and source branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^firmware-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid firmware release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install Padauk build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends sdcc make gawk
          sdcc --version
          makebin --version || true

      - name: Build PMS150C firmware
        shell: bash
        run: |
          set -euo pipefail
          make -C codebase/VSCODE_FreePDK clean build

      - name: Create and verify immutable release assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/create_firmware_release.py \
            --binary codebase/VSCODE_FreePDK/.output/slowclocksleep_PMS150C.bin \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --sdcc-version "$(sdcc --version | head -n 1)" \
            --output dist
          cd dist
          sha256sum --check slowclocksleep_PMS150C.bin.sha256

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/slowclocksleep_PMS150C.bin \
            dist/slowclocksleep_PMS150C.bin.sha256 \
            dist/mouseminder-firmware.json \
            --verify-tag \
            --generate-notes \
            --title "MouseMinder firmware ${GITHUB_REF_NAME#firmware-v}"
